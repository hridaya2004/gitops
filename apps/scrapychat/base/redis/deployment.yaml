apiVersion: apps/v1
kind: Deployment

metadata:
  name: scrapychat-redis
  labels:
    app: scrapychat-redis

spec:
  selector:
    matchLabels:
      app: scrapychat-redis
  template:
    metadata:
      labels:
        app: scrapychat-redis
    spec:
      containers:
        - name: scrapychat-redis
          image: redis:8.0-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
