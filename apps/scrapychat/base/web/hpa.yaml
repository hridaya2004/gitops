apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: scrapychat-web-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scrapychat-web
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
