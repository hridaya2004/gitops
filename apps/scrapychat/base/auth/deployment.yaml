apiVersion: apps/v1
kind: Deployment

metadata:
  name: scrapychat-auth
  labels:
    app: scrapychat-auth

spec:
  selector:
    matchLabels:
      app: scrapychat-auth
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: scrapychat-auth
    spec:
      containers:
        - name: scrapychat-auth
          image: ghcr.io/hridaya2004/scrapychat/scrapychat-auth:1.9
          ports:
            - containerPort: 3001
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo-service.monitoring.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: scrapychat-auth-service
          envFrom:
            - secretRef:
                name: scrapychat-auth-secrets
          volumeMounts:
            - mountPath: /data
              name: scrapychat-auth-pv
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      initContainers:
        - name: scrapychat-migrate
          image: ghcr.io/hridaya2004/scrapychat/scrapychat-migrate:1.9
          envFrom:
            - secretRef:
                name: scrapychat-auth-secrets
          volumeMounts:
            - mountPath: /data
              name: scrapychat-auth-pv
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: scrapychat-auth-pv
          persistentVolumeClaim:
            claimName: scrapychat-auth-pvc
