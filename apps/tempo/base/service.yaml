apiVersion: v1
kind: Service

metadata:
  name: tempo-service

spec:
  selector:
    app: tempo
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      protocol: TCP
      targetPort: 4317
    - name: otlp-http
      port: 4318
      protocol: TCP
      targetPort: 4318
