apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

spec:
  hostnames:
    - pesa.hridaya.dev
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  rules:
    - backendRefs:
        - name: pesa-frontend
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
