apiVersion: apps/v1
kind: Deployment
metadata:
  name: change-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: change-detection
  template:
    metadata:
      labels:
        app: change-detection
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: change-detection
          image: lscr.io/linuxserver/changedetection.io:0.55.7
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: change-detection-cm
          volumeMounts:
            - mountPath: /config
              name: change-detection-pv
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: change-detection-pv
          persistentVolumeClaim:
            claimName: change-detection-pvc
