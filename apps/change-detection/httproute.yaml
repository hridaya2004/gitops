apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: change-detection-route

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - 'changedetection.hridaya.tech'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: change-detection
          port: 80
          weight: 1
