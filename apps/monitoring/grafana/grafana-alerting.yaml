apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
data:
  alerting.yaml: |
    apiVersion: 1

    groups:
      - orgId: 1
        name: monitoring
        folder: kubernetes
        interval: 30s
        rules:

          - uid: pod_crash_looping
            title: PodCrashLooping
            condition: A
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: prometheus
                model:
                  instant: true
                  expr: sum by (pod, namespace, container) (increase(kube_pod_container_status_restarts_total[15m])) > 3
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is crash looping"

          - uid: pod_oom_killed
            title: PodOOMKilled
            condition: A
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  instant: true
                  expr: increase(container_oom_events_total[5m]) > 0
            noDataState: NoData
            execErrState: Error
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} was OOMKilled"

          - uid: pod_pending
            title: PodPending
            condition: A
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: prometheus
                model:
                  instant: true
                  expr: kube_pod_status_phase{phase="Pending", namespace!~"kube-system"} > 0
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been pending for 5m"

          - uid: container_restart_high
            title: ContainerRestartHigh
            condition: A
            data:
              - refId: A
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: prometheus
                model:
                  # Scoped to monitoring namespace only — intentional
                  instant: true
                  expr: sum by (pod, namespace, container) (increase(kube_pod_container_status_restarts_total{namespace="monitoring"}[1h])) > 2
            noDataState: NoData
            execErrState: Error
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Monitoring container {{ $labels.container }} restarted {{ $value }} times in 1h"

          - uid: node_disk_pressure
            title: NodeDiskPressure
            condition: A
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: prometheus
                model:
                  instant: true
                  expr: >-
                    node_filesystem_avail_bytes{mountpoint="/", fstype!=""}
                    / node_filesystem_size_bytes{mountpoint="/", fstype!=""}
                    < 0.1
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              # Fixed: node_filesystem_* carries "instance" label, not "node"
              summary: "Node {{ $labels.instance }} disk is >90% full"

          - uid: node_not_ready
            title: NodeNotReady
            condition: A
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  instant: true
                  expr: min by (node) (kube_node_status_condition{condition="Ready", status="true"}) < 1
            noDataState: NoData
            execErrState: Error
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} has been NotReady for 2m"

          - uid: node_memory_pressure
            title: NodeMemoryPressure
            condition: A
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: prometheus
                model:
                  instant: true
                  expr: >-
                    node_memory_MemAvailable_bytes
                    / node_memory_MemTotal_bytes
                    < 0.1
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.instance }} memory is >90% used"
