apiVersion: apps/v1
kind: Deployment

metadata:
  name: portfolio-deployment
  labels:
    app: portfolio

spec:
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: web
          image: ghcr.io/hridaya2004/portfolio:latest
          ports:
            - containerPort: 8080
      imagePullSecrets:
        - name: ghcr-secret
