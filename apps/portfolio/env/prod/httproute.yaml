apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: portfolio-route

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "hridaya.tech"
    - "www.hridaya.tech"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: portfolio-service
          port: 80
