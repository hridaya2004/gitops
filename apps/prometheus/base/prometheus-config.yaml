apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: node-exporter
        dns_sd_configs:
          - names:
              - node-exporter.monitoring.svc.cluster.local
            type: A
            port: 9100

      - job_name: kube-state-metrics
        dns_sd_configs:
          - names:
              - kube-state-metrics.monitoring.svc.cluster.local
            type: A
            port: 8080
