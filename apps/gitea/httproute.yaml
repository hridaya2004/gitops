apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: gitea-route

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - 'gitea.hridaya.tech'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: gitea-http
          port: 3000
