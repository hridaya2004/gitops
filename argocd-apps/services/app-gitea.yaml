apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gitea
  namespace: argocd

spec:
  project: default
  sources:
    - repoURL: https://dl.gitea.com/charts
      chart: gitea
      targetRevision: 12.6.0
      helm:
        values: |
          ingress:
            enabled: false

          valkey-cluster:
            enabled: false
          valkey:
            enabled: true
          postgresql:
            enabled: true
          postgresql-ha:
            enabled: false

          persistence:
            enabled: true
            size: 10Gi

          gitea:
            config:
              database:
                DB_TYPE: postgres
              indexer:
                ISSUE_INDEXER_TYPE: bleve
                REPO_INDEXER_ENABLED: true
              server:
                DOMAIN: gitea.hridaya.tech
                ROOT_URL: https://gitea.hridaya.tech/
              service:
                DISABLE_REGISTRATION: true
            admin:
              existingSecret: gitea-admin-secret
    - repoURL: https://github.com/hridaya2004/gitops.git
      targetRevision: main
      path: apps/gitea
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
