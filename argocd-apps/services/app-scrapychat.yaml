apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: scrapychat
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/hridaya2004/gitops.git
    targetRevision: main
    path: apps/scrapychat

  destination:
    server: https://kubernetes.default.svc
    namespace: scrapychat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
