apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrapychat
  namespace: argocd
spec:
  destination:
    namespace: scrapychat
    server: https://kubernetes.default.svc
  project: default
  source:
    path: k8s/
    repoURL: https://github.com/hridaya2004/scrapychat.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
