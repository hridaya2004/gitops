apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default
  sources:
    - repoURL: https://github.com/hridaya2004/gitops.git
      targetRevision: main
      path: apps/grafana/
    - repoURL: https://github.com/hridaya2004/gitops.git
      targetRevision: main
      path: apps/prometheus/

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
