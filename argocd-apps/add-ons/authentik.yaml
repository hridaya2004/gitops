apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  destination:
    namespace: authentik
    server: https://kubernetes.default.svc
  project: default
  sources:
    - chart: authentik
      helm:
        releaseName: authentik
        values: |
          authentik:
            existingSecret:
              secretName: authentik

          global:
            env:
              - name: AUTHENTIK_POSTGRESQL__HOST
                value: authentik-db-rw
              - name: AUTHENTIK_POSTGRESQL__NAME
                value: authentik
              - name: AUTHENTIK_POSTGRESQL__USER
                valueFrom:
                  secretKeyRef:
                    name: authentik-db-app
                    key: username
              - name: AUTHENTIK_POSTGRESQL__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: authentik-db-app
                    key: password

          blueprints:
            configMaps:
              - authentik-blueprints

          server:
            # Keep the server on the same node as authentik-db (remoteserver
            # reaches the cluster only via a ~190ms Tailscale DERP relay).
            nodeSelector:
              kubernetes.io/hostname: archlinux
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
            # Generous timeouts: this cluster spans two nodes over Tailscale,
            # and DB/DNS round-trips can make health checks slow.
            livenessProbe:
              failureThreshold: 3
              initialDelaySeconds: 5
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 10
              httpGet:
                path: /-/health/live/
                port: http
            readinessProbe:
              failureThreshold: 3
              initialDelaySeconds: 5
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 10
              httpGet:
                path: /-/health/ready/
                port: http
            startupProbe:
              failureThreshold: 60
              initialDelaySeconds: 5
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 10
              httpGet:
                path: /-/health/live/
                port: http
            route:
              main:
                enabled: true
                hostnames:
                  - auth.hridaya.dev
                parentRefs:
                  - group: gateway.networking.k8s.io
                    kind: Gateway
                    name: traefik-gateway
                    namespace: traefik

          worker:
            # Keep the worker on the same node as authentik-db as well.
            nodeSelector:
              kubernetes.io/hostname: archlinux
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
            livenessProbe:
              failureThreshold: 3
              initialDelaySeconds: 5
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 10
              exec:
                command:
                  - ak
                  - healthcheck
            readinessProbe:
              failureThreshold: 3
              initialDelaySeconds: 5
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 10
              exec:
                command:
                  - ak
                  - healthcheck
            startupProbe:
              failureThreshold: 60
              initialDelaySeconds: 30
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 10
              exec:
                command:
                  - ak
                  - healthcheck
      repoURL: https://charts.goauthentik.io
      targetRevision: 2026.8.5
    - path: infra/authentik
      repoURL: https://github.com/hridaya2004/gitops.git
      targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
