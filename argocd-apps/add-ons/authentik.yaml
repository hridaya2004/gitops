apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  destination:
    namespace: authentik
    server: https://kubernetes.default.svc
  project: default
  sources:
    - chart: authentik
      helm:
        releaseName: authentik
        values: |
          postgresql:
            enabled: false
          authentik:
            postgresql:
              host: cnpg-authentik-rw
              name: authentik
              user: file:///cnpg-creds/username
              password: file:///cnpg-creds/password
          global:
            env:
              - name: AUTHENTIK_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: authentik-secret-key
                    key: secret_key
              - name: AUTHENTIK_REDIS__HOST
                value: valkey-authentik
              - name: AUTHENTIK_REDIS__PORT
                value: "6379"
          server:
            route:
              main:
                enabled: true
                hostnames:
                  - auth.hridaya.dev
                parentRefs:
                  - group: gateway.networking.k8s.io
                    kind: Gateway
                    name: traefik-gateway
                    namespace: traefik
            volumes:
              - name: cnpg-creds
                secret:
                  secretName: cnpg-authentik-creds
            volumeMounts:
              - name: cnpg-creds
                mountPath: /cnpg-creds
                readOnly: true
          worker:
            volumes:
              - name: cnpg-creds
                secret:
                  secretName: cnpg-authentik-creds
            volumeMounts:
              - name: cnpg-creds
                mountPath: /cnpg-creds
                readOnly: true
      repoURL: https://charts.goauthentik.io
      targetRevision: 2026.5.5
    - chart: valkey
      helm:
        releaseName: valkey-authentik
        values: |
          architecture: standalone
          auth:
            enabled: false
          primary:
            replicaCount: 1
            persistence:
              enabled: false
            resourcesPreset: none
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          replica:
            replicaCount: 0
      repoURL: https://charts.bitnami.com/bitnami
      targetRevision: 6.2.0
    - path: infra/authentik
      repoURL: https://github.com/hridaya2004/gitops.git
      targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
