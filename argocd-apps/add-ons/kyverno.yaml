apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  name: kyverno
  namespace: argocd
spec:
  destination:
    namespace: kyverno
    server: https://kubernetes.default.svc
  project: default
  sources:
    - chart: kyverno
      helm:
        values: |
          config:
            preserve: false
          webhookLabels:
            app.kubernetes.io/managed-by: argocd
      repoURL: https://kyverno.github.io/kyverno
      targetRevision: 3.8.1
    - path: infra/kyverno
      repoURL: https://github.com/hridaya2004/gitops.git
      targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
