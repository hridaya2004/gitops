apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true

spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: 3.8.1
      helm:
        values: |
          config:
            preserve: false
          webhookLabels:
            app.kubernetes.io/managed-by: argocd
    - repoURL: https://github.com/hridaya2004/gitops.git
      targetRevision: main
      path: infra/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
