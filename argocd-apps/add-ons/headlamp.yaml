apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: headlamp
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.42.0

    helm:
      values: |
        nodeSelector:
          node-role.kubernetes.io/control-plane: "true"

        service:
          type: ClusterIP
        ingress:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
