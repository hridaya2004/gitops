apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  - argocd-root-app
  - argocd-notifications-secret.yaml
  - argocd-authentik-oidc-sealedsecret.yaml
  - ../apps/baseline/limits
patches:
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    path: argocd-application-controller-resources-patch.yaml
  - target:
      kind: Deployment
      name: argocd-repo-server
    path: argocd-repo-server-resources-patch.yaml
  - target:
      kind: Service
      name: argocd-server
    path: argocd-server-nodeport-patch.yaml
  - target:
      kind: ConfigMap
      name: argocd-cm
    path: argocd-cm-patch.yaml
  - target:
      kind: ConfigMap
      name: argocd-rbac-cm
    path: argocd-rbac-cm-patch.yaml
  - target:
      kind: ConfigMap
      name: argocd-notifications-cm
    path: argocd-notifications-cm-patch.yaml
