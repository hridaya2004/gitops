apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  rules:
    - match:
        any:
          - resources:
              kinds:
                - Pod
      name: require-image-tag
      validate:
        message: Using :latest tag is not allowed
        pattern:
          spec:
            containers:
              - image: '!*:latest'
  validationFailureAction: Audit
