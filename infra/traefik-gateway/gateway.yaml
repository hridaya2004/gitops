apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: traefik-gateway
  namespace: traefik

spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All

      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: tls-hridaya-dev
            namespace: traefik
