apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: traefik-gateway
  namespace: traefik

spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - portfolio
                  - scrapychat
                  - gitea
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: tls-hridaya-tech
            namespace: traefik
